<h1>Week 12: Function & Events</h1>
<p>In this week we learned about functions and events in JavaScript. Functions are reusable blocks of code that can be called to perform a specific task, while events are actions that occur in the browser, such as clicks or key presses, that can trigger functions to run.</p>
